name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore HslBikeApp.slnx

      - name: Build
        run: dotnet build HslBikeApp.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test HslBikeApp.slnx --no-build --configuration Release --verbosity normal
